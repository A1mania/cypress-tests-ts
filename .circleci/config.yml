version: 2.1

jobs:
  cypress-tests:
    docker:
      - image: cypress/browsers:node18.12.0-chrome107
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Run Cypress tests
          command: npx cypress run

workflows:
  cypress-workflow:
    jobs:
      - cypress-tests

report:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      
      - store_artifacts:
          path: cypress-report/
          destination: cypress-report
      
      - run:
          name: Display report URL
          command: |
            echo "📊 Test Report is available at:"
            echo "https://output.circle-artifacts.com/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/0/cypress-report/index.html"
          when: always

